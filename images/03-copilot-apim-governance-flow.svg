<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Copilot 호출 운영 전환 흐름</title>
  <desc id="desc">VS Code Copilot과 Copilot CLI 호출을 APIM AI 게이트웨이를 통해 Foundry 배포로 보내는 운영 전환 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter><style>.bg{fill:#f8fafc}.title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.client{fill:#eff6ff;stroke:#60a5fa}.gate{fill:#ecfeff;stroke:#22d3ee;stroke-width:3}.back{fill:#eef2ff;stroke:#818cf8}.label{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#334155}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.chip{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5;rx:10}.chiptext{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#166534}</style></defs>
  <rect class="bg" width="1180" height="420"/>
  <text x="590" y="52" text-anchor="middle" class="title">Copilot 호출도 운영 단계에서는 APIM으로 통합</text>
  <text x="590" y="82" text-anchor="middle" class="sub">개발자 도구의 LLM 사용량까지 앱 API 호출과 같은 정책, 메트릭, 로그 체계에 포함합니다</text>
  <rect x="80" y="145" width="230" height="135" class="box client"/><text x="195" y="185" text-anchor="middle" class="label">Copilot 클라이언트</text><text x="195" y="220" text-anchor="middle" class="small">VS Code Copilot Chat</text><text x="195" y="247" text-anchor="middle" class="small">GitHub Copilot CLI</text>
  <rect x="475" y="125" width="240" height="175" class="box gate"/><text x="595" y="170" text-anchor="middle" class="label">APIM AI 게이트웨이</text><rect x="505" y="200" width="90" height="30" class="chip"/><text x="550" y="220" text-anchor="middle" class="chiptext">토큰 한도</text><rect x="615" y="200" width="80" height="30" class="chip"/><text x="655" y="220" text-anchor="middle" class="chiptext">쿼터</text><rect x="505" y="245" width="90" height="30" class="chip"/><text x="550" y="265" text-anchor="middle" class="chiptext">메트릭</text><rect x="615" y="245" width="80" height="30" class="chip"/><text x="655" y="265" text-anchor="middle" class="chiptext">로깅</text>
  <rect x="880" y="145" width="220" height="135" class="box back"/><text x="990" y="190" text-anchor="middle" class="label">Foundry 배포</text><text x="990" y="225" text-anchor="middle" class="small">Azure OpenAI / Foundry Models</text><text x="990" y="252" text-anchor="middle" class="small">단일 백엔드 정책 적용</text>
  <path class="arrow" d="M310 212 L475 212"/><path class="arrow" d="M715 212 L880 212"/>
  <text x="392" y="195" text-anchor="middle" class="small">엔드포인트 변경</text><text x="798" y="195" text-anchor="middle" class="small">관리 ID/백엔드 인증</text>
</svg>
