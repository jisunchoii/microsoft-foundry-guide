<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">APIM AI 게이트웨이 중앙 진입점 아키텍처</title>
  <desc id="desc">앱, 배치, VS Code Copilot, Copilot CLI 호출을 APIM AI 게이트웨이에 모아 Foundry 배포로 전달하는 구조</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter><style>.bg{fill:#f8fafc}.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.client{fill:#eff6ff;stroke:#60a5fa}.gate{fill:#ecfeff;stroke:#22d3ee;stroke-width:3}.back{fill:#eef2ff;stroke:#818cf8}.label{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#334155}.policy{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#155e75}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.chip{fill:#fff;stroke:#67e8f9;stroke-width:1.5;rx:10}</style></defs>
  <rect class="bg" width="1280" height="520"/>
  <text x="640" y="52" text-anchor="middle" class="title">모든 LLM 호출을 APIM AI 게이트웨이로 모으는 운영 구조</text>
  <text x="640" y="84" text-anchor="middle" class="sub">앱, 자동화, 개발자 Copilot 호출이 같은 거버넌스 정책을 통과합니다</text>
  <rect x="80" y="130" width="210" height="58" class="box client"/><text x="185" y="166" text-anchor="middle" class="label">앱/서비스 API</text>
  <rect x="80" y="215" width="210" height="58" class="box client"/><text x="185" y="251" text-anchor="middle" class="label">배치/자동화</text>
  <rect x="80" y="300" width="210" height="58" class="box client"/><text x="185" y="336" text-anchor="middle" class="label">VS Code Copilot</text>
  <rect x="80" y="385" width="210" height="58" class="box client"/><text x="185" y="421" text-anchor="middle" class="label">Copilot CLI</text>
  <rect x="500" y="145" width="280" height="250" class="box gate"/><text x="640" y="190" text-anchor="middle" class="label">APIM AI 게이트웨이</text><rect x="535" y="225" width="95" height="32" class="chip"/><text x="582" y="246" text-anchor="middle" class="policy">인증·권한</text><rect x="650" y="225" width="95" height="32" class="chip"/><text x="697" y="246" text-anchor="middle" class="policy">토큰 한도</text><rect x="535" y="275" width="95" height="32" class="chip"/><text x="582" y="296" text-anchor="middle" class="policy">메트릭</text><rect x="650" y="275" width="95" height="32" class="chip"/><text x="697" y="296" text-anchor="middle" class="policy">로그·감사</text><rect x="535" y="325" width="95" height="32" class="chip"/><text x="582" y="346" text-anchor="middle" class="policy">캐싱</text><rect x="650" y="325" width="95" height="32" class="chip"/><text x="697" y="346" text-anchor="middle" class="policy">콘텐츠 안전</text>
  <rect x="960" y="220" width="230" height="120" class="box back"/><text x="1075" y="265" text-anchor="middle" class="label">Foundry / Azure OpenAI</text><text x="1075" y="300" text-anchor="middle" class="small">모델 배포 백엔드</text>
  <path class="arrow" d="M290 159 C380 159,410 222,500 235"/><path class="arrow" d="M290 244 L500 265"/><path class="arrow" d="M290 329 L500 305"/><path class="arrow" d="M290 414 C380 414,410 350,500 335"/><path class="arrow" d="M780 270 L960 280"/>
