<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">APIM AI 게이트웨이 관측 가능성 데이터 흐름</title>
  <desc id="desc">토큰 메트릭, 프롬프트와 완성 로그가 Application Insights, Azure Monitor, Log Analytics, Datadog으로 흐르는 데이터 소스 계층</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter><style>.bg{fill:#f8fafc}.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.source{fill:#eff6ff;stroke:#60a5fa}.gate{fill:#ecfeff;stroke:#22d3ee;stroke-width:3}.store{fill:#f0fdf4;stroke:#4ade80}.view{fill:#fff7ed;stroke:#fb923c}.label{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#334155}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.lane{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 8}</style></defs>
  <rect class="bg" width="1280" height="520"/>
  <text x="640" y="52" text-anchor="middle" class="title">관측 가능성 데이터 소스 계층</text>
  <text x="640" y="84" text-anchor="middle" class="sub">게이트웨이 정책과 진단 설정에서 나온 메트릭과 로그를 분석 도구로 연결합니다</text>
  <line x1="70" y1="225" x2="1210" y2="225" class="lane"/><line x1="70" y1="355" x2="1210" y2="355" class="lane"/>
  <rect x="70" y="145" width="230" height="95" class="box source"/><text x="185" y="181" text-anchor="middle" class="label">소비자별 토큰 메트릭</text><text x="185" y="211" text-anchor="middle" class="small">Subscription ID / User ID / API ID</text>
  <rect x="70" y="275" width="230" height="95" class="box source"/><text x="185" y="311" text-anchor="middle" class="label">프롬프트·완성·토큰 로그</text><text x="185" y="341" text-anchor="middle" class="small">요청/응답 감사와 디버깅</text>
  <rect x="390" y="205" width="230" height="105" class="box gate"/><text x="505" y="244" text-anchor="middle" class="label">APIM AI 게이트웨이</text><text x="505" y="276" text-anchor="middle" class="small">llm-emit-token-metric</text><text x="505" y="298" text-anchor="middle" class="small">Generative AI logs</text>
  <rect x="720" y="125" width="250" height="95" class="box store"/><text x="845" y="162" text-anchor="middle" class="label">Application Insights</text><text x="845" y="192" text-anchor="middle" class="small">커스텀 메트릭 + Azure Monitor Metrics</text>
  <rect x="720" y="295" width="250" height="95" class="box store"/><text x="845" y="332" text-anchor="middle" class="label">Log Analytics</text><text x="845" y="362" text-anchor="middle" class="small">ApiManagementGatewayLlmLog</text>
  <rect x="1050" y="145" width="180" height="80" class="box view"/><text x="1140" y="180" text-anchor="middle" class="label">Azure Monitor</text><text x="1140" y="207" text-anchor="middle" class="small">KQL · Workbook · Alert</text>
  <rect x="1050" y="295" width="180" height="80" class="box view"/><text x="1140" y="330" text-anchor="middle" class="label">Datadog</text><text x="1140" y="357" text-anchor="middle" class="small">Native ISV / 메트릭 연동</text>
  <path class="arrow" d="M300 192 C345 192,350 246,390 246"/><path class="arrow" d="M300 322 C345 322,350 270,390 270"/><path class="arrow" d="M620 246 C665 246,675 172,720 172"/><path class="arrow" d="M620 270 C665 270,675 342,720 342"/><path class="arrow" d="M970 172 L1050 185"/><path class="arrow" d="M970 342 L1050 335"/><path class="arrow" d="M970 172 C1010 185,1015 300,1050 318"/>
</svg>
